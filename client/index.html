<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1e24" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Random Chuck Norris facts, searchable by category or free text."
    />

    <link rel="icon" href="/chuck-logo.png" />
    <link rel="apple-touch-icon" href="/chuck-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // The rest of the theme logic stays in useHeader; this only mirrors what
      // it will conclude on mount.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {
          /* Storage can be blocked; the app falls back to light. */
        }
      })();
    </script>

    <title>Chuck Norris Facts - KWK</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
